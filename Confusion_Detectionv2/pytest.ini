[pytest]
# Every stage folder is named 01_..06_ (leading digit) so it can't be a
# valid dotted Python identifier. Plain `importlib.import_module()`
# handles that fine, but pytest's *default* "prepend" import mode
# refuses to build a dotted test-module name through a non-identifier
# path segment, even with __init__.py present at every level -- it
# fails with "attempted relative import beyond top-level package" for
# ANY test file that does `from ..src.x import y` inside a numbered
# stage. --import-mode=importlib resolves modules differently (not by
# walking up __init__.py-having directories to build a dotted name) and
# doesn't hit this restriction. Needed project-wide, not just for one
# stage, since every stage has the same digit-prefixed folder name.
addopts = --import-mode=importlib
markers =
    slow: exercises a real downloaded model (sentence-transformers) -- slower, needs internet on first run.
